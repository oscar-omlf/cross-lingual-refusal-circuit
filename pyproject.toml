[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "refusal-circuit-rq1"
version = "0.1.0"
description = "RQ1 refusal-direction circuit experiments built on EAP-IG"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
