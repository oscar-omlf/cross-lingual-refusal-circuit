[project]
name = "persona-vectors-replication-runtime"
version = "0.1.0"
description = "Isolated runtime for the frozen Anthropic Persona Vectors replication stages"
requires-python = ">=3.10,<3.11"
dependencies = [
    "accelerate==1.7.0",
    "openai==1.70.0",
    "pandas==2.3.1",
    "torch==2.6.0",
    "tqdm==4.67.1",
    "transformers==4.52.3",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
